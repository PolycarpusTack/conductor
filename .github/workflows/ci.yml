name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install

      - name: Validate Prisma schema syntax
        run: bunx prisma validate

      - name: Apply migrations to CI database
        run: bunx prisma db push --accept-data-loss
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Assert Prisma client is up to date
        run: |
          bunx prisma generate
          git diff --exit-code src/generated/prisma/ || \
            (echo "ERROR: Prisma client is stale. Run 'bun run db:generate' and commit the result." && exit 1)

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:./prisma/ci.db
          SKIP_ENV_VALIDATION: "1"
